name: Release npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string
      confirmation:
        description: Type PUBLISH-TTEOP-MCP to authorize publication
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish npm and create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          # No registry-url here on purpose: it writes an empty _authToken
          # line to .npmrc that defeats OIDC trusted publishing.

      - name: Upgrade npm for OIDC trusted publishing
        # Node 22 ships npm 10.9.x; OIDC trusted publishing requires npm >= 11.5.1.
        # Pin npm 11 (not @latest) to avoid npm 12 which needs Node >= 22.22.2.
        run: npm install -g npm@11

      - name: Confirm explicit publication authorization
        env:
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_CONFIRMATION" == "PUBLISH-TTEOP-MCP" ]]
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          [[ "$RELEASE_VERSION" == "$PACKAGE_VERSION" ]]

      - run: npm ci
      - run: npm run test:all
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run

      - name: Require a clean release worktree
        run: |
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Publish with npm OIDC trusted publishing
        # No NODE_AUTH_TOKEN needed — npm CLI auto-detects the OIDC environment
        # (id-token: write permission above) and authenticates via short-lived
        # workflow-specific token. Provenance is automatic with trusted publishing.
        run: npm publish --access public --provenance

      - name: Create immutable GitHub release at the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            --target "${{ github.sha }}" \
            --title "tteop-mcp v${RELEASE_VERSION}" \
            --generate-notes
