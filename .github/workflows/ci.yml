name: TTEOP MCP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: MCP client + packaged tarball tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Real MCP client test
        run: node test/test-mcp-client.mjs

      - name: Packaged tarball test
        run: node test/test-packaged-tarball.mjs

      - name: Release metadata agreement
        run: node test/test-release-metadata.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify --version
        run: |
          output=$(node bin/tteop-mcp.mjs --version)
          echo "Version: $output"
          [[ "$output" == "tteop-mcp/"* ]] || { echo "Version format wrong"; exit 1; }

      - name: Verify --help
        run: |
          output=$(node bin/tteop-mcp.mjs --help)
          echo "$output" | grep -q "tteop_build_envelope" || { echo "help missing tool names"; exit 1; }
          echo "$output" | grep -q "tteop_validate_envelope" || { echo "help missing validate tool"; exit 1; }
